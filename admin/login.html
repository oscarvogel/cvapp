<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Inicio de Sesión</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Vue.js -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .login-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-attachment: fixed;
        }
        
        .floating {
            animation: floating 6s ease-in-out infinite;
        }
        
        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        .fade-in {
            animation: fadeIn 0.8s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .shake {
            animation: shake 0.6s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
    </style>
</head>
<body>
    <div id="app" class="login-container">
        <!-- Background decorativo -->
        <div class="absolute inset-0 overflow-hidden pointer-events-none">
            <div class="floating absolute top-20 left-10 w-20 h-20 bg-white opacity-10 rounded-full"></div>
            <div class="floating absolute top-40 right-20 w-16 h-16 bg-white opacity-5 rounded-full" style="animation-delay: 2s;"></div>
            <div class="floating absolute bottom-32 left-1/4 w-12 h-12 bg-white opacity-8 rounded-full" style="animation-delay: 4s;"></div>
            <div class="floating absolute bottom-20 right-1/3 w-24 h-24 bg-white opacity-6 rounded-full" style="animation-delay: 1s;"></div>
        </div>
        
        <div class="relative z-10 flex items-center justify-center min-h-screen p-4">
            <div class="w-full max-w-md">
                <!-- Header -->
                <div class="text-center mb-8 fade-in">
                    <div class="mx-auto w-20 h-20 bg-white bg-opacity-20 rounded-full flex items-center justify-center mb-4 glass-effect">
                        <i class="fas fa-shield-alt text-3xl text-white"></i>
                    </div>
                    <h1 class="text-3xl font-bold text-white mb-2">Panel de Administración</h1>
                    <p class="text-white text-opacity-80">Ingresa tus credenciales para continuar</p>
                </div>
                
                <!-- Formulario de Login -->
                <div class="glass-effect rounded-2xl p-8 shadow-2xl fade-in" :class="{ 'shake': shakeForm }">
                    <!-- Alertas -->
                    <div v-if="error" class="mb-6 p-4 bg-red-500 bg-opacity-20 border border-red-400 border-opacity-30 rounded-lg text-red-100 text-sm">
                        <i class="fas fa-exclamation-circle mr-2"></i>
                        {{ error }}
                    </div>
                    
                    <div v-if="success" class="mb-6 p-4 bg-green-500 bg-opacity-20 border border-green-400 border-opacity-30 rounded-lg text-green-100 text-sm">
                        <i class="fas fa-check-circle mr-2"></i>
                        {{ success }}
                    </div>
                    
                    <form @submit.prevent="login">
                        <!-- Username -->
                        <div class="mb-6">
                            <label class="block text-white text-sm font-medium mb-2" for="username">
                                <i class="fas fa-user mr-2"></i>
                                Usuario o Email
                            </label>
                            <input 
                                v-model="credentials.username"
                                type="text" 
                                id="username"
                                class="w-full px-4 py-3 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-lg text-white placeholder-white placeholder-opacity-60 focus:outline-none focus:ring-2 focus:ring-white focus:ring-opacity-30 focus:border-white focus:border-opacity-40 transition-all duration-300"
                                placeholder="Ingresa tu usuario o email"
                                required
                                :disabled="loading"
                            >
                        </div>
                        
                        <!-- Password -->
                        <div class="mb-6">
                            <label class="block text-white text-sm font-medium mb-2" for="password">
                                <i class="fas fa-lock mr-2"></i>
                                Contraseña
                            </label>
                            <div class="relative">
                                <input 
                                    v-model="credentials.password"
                                    :type="showPassword ? 'text' : 'password'"
                                    id="password"
                                    class="w-full px-4 py-3 pr-12 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-lg text-white placeholder-white placeholder-opacity-60 focus:outline-none focus:ring-2 focus:ring-white focus:ring-opacity-30 focus:border-white focus:border-opacity-40 transition-all duration-300"
                                    placeholder="Ingresa tu contraseña"
                                    required
                                    :disabled="loading"
                                >
                                <button 
                                    type="button" 
                                    @click="showPassword = !showPassword"
                                    class="absolute right-3 top-1/2 transform -translate-y-1/2 text-white text-opacity-60 hover:text-opacity-80 transition-colors duration-200"
                                    :disabled="loading"
                                >
                                    <i :class="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                                </button>
                            </div>
                        </div>
                        
                        <!-- Remember me -->
                        <div class="mb-6">
                            <label class="flex items-center text-white text-sm cursor-pointer">
                                <input 
                                    v-model="credentials.remember"
                                    type="checkbox" 
                                    class="mr-3 w-4 h-4 text-white bg-white bg-opacity-10 border border-white border-opacity-20 rounded focus:ring-white focus:ring-opacity-30"
                                    :disabled="loading"
                                >
                                Recordar sesión
                            </label>
                        </div>
                        
                        <!-- Botón Login -->
                        <button 
                            type="submit"
                            class="w-full py-3 px-4 bg-white bg-opacity-20 hover:bg-opacity-30 text-white font-medium rounded-lg transition-all duration-300 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-white focus:ring-opacity-30 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none"
                            :disabled="loading || !isFormValid"
                        >
                            <span v-if="loading" class="flex items-center justify-center">
                                <i class="fas fa-spinner fa-spin mr-2"></i>
                                Iniciando sesión...
                            </span>
                            <span v-else class="flex items-center justify-center">
                                <i class="fas fa-sign-in-alt mr-2"></i>
                                Iniciar Sesión
                            </span>
                        </button>
                    </form>
                    
                    <!-- Links adicionales -->
                    <div class="mt-6 text-center">
                        <a href="./forgot_password.html" class="text-white text-opacity-70 hover:text-opacity-90 text-sm transition-colors duration-200">
                            <i class="fas fa-question-circle mr-1"></i>
                            ¿Olvidaste tu contraseña?
                        </a>
                    </div>
                </div>
                
                <!-- Footer -->
                <div class="text-center mt-8 text-white text-opacity-60 text-sm fade-in">
                    <p>© 2025 Sistema de Administración. Todos los derechos reservados.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        
        createApp({
            data() {
                return {
                    credentials: {
                        username: '',
                        password: '',
                        remember: false
                    },
                    loading: false,
                    error: '',
                    success: '',
                    showPassword: false,
                    shakeForm: false
                }
            },
            
            computed: {
                isFormValid() {
                    return this.credentials.username.trim().length >= 3 && 
                           this.credentials.password.length >= 6;
                }
            },
            
            mounted() {
                this.checkExistingSession();
            },
            
            methods: {
                async checkExistingSession() {
                    // Pequeño delay para asegurar que cualquier logout se haya procesado
                    await new Promise(resolve => setTimeout(resolve, 200));
                    
                    try {
                        const response = await fetch('./backend/api/check-session.php', {
                            credentials: 'include',
                            cache: 'no-cache'
                        });
                        
                        if (!response.ok) {
                            console.log('No hay sesión activa - respuesta no OK');
                            return;
                        }
                        
                        const data = await response.json();
                        
                        if (data.success && data.logged_in && data.user) {
                            console.log('Sesión válida encontrada, redirigiendo...');
                            // Ya está logueado, redirigir al dashboard
                            window.location.href = './dashboard.php';
                        } else {
                            console.log('No hay sesión válida');
                        }
                    } catch (error) {
                        console.log('No hay sesión activa:', error.message);
                    }
                },
                
                async login() {
                    if (!this.isFormValid) return;
                    
                    this.loading = true;
                    this.error = '';
                    this.success = '';
                    
                    try {
                        const response = await fetch('./backend/api/login.php', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                username: this.credentials.username.trim(),
                                password: this.credentials.password
                            })
                        });
                        
                        // Verificar si la respuesta es JSON válida
                        const contentType = response.headers.get('content-type');
                        if (!contentType || !contentType.includes('application/json')) {
                            const textResponse = await response.text();
                            console.error('Respuesta no JSON:', textResponse);
                            throw new Error('El servidor no devolvió JSON válido. Respuesta: ' + textResponse.substring(0, 200));
                        }
                        
                        const data = await response.json();
                        
                        if (data.success) {
                            this.success = 'Login exitoso. Redirigiendo...';
                            
                            // Guardar preferencias si se marcó "recordar"
                            if (this.credentials.remember) {
                                localStorage.setItem('admin_remember', 'true');
                                localStorage.setItem('admin_username', this.credentials.username);
                            } else {
                                localStorage.removeItem('admin_remember');
                                localStorage.removeItem('admin_username');
                            }
                            
                            // Redirigir después de 1 segundo
                            setTimeout(() => {
                                window.location.href = './dashboard.php';
                            }, 1000);
                            
                        } else {
                            this.error = data.message || 'Error en el login';
                            if (data.debug) {
                                console.error('Debug info:', data.debug);
                                this.error += ' (Ver consola para más detalles)';
                            }
                            this.shakeForm = true;
                            setTimeout(() => {
                                this.shakeForm = false;
                            }, 600);
                        }
                        
                    } catch (error) {
                        console.error('Error en login:', error);
                        this.error = error.message || 'Error de conexión. Intenta nuevamente.';
                        this.shakeForm = true;
                        setTimeout(() => {
                            this.shakeForm = false;
                        }, 600);
                    } finally {
                        this.loading = false;
                    }
                },
                
                loadRememberedCredentials() {
                    if (localStorage.getItem('admin_remember') === 'true') {
                        this.credentials.username = localStorage.getItem('admin_username') || '';
                        this.credentials.remember = true;
                    }
                }
            },
            
            created() {
                this.loadRememberedCredentials();
            }
        }).mount('#app');
    </script>
</body>
</html>
