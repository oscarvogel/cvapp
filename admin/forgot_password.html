<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100">
    <div id="app" class="min-h-screen flex items-center justify-center p-6">
        <div class="w-full max-w-md bg-white rounded-2xl p-8 shadow">
            <h2 class="text-2xl font-bold mb-4">Recuperar contraseña</h2>
            <p class="text-sm text-gray-600 mb-6">Ingresa el correo asociado a tu cuenta y te enviaremos instrucciones para restablecer la contraseña.</p>

            <div v-if="error" class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded">{{ error }}</div>
            <div v-if="success" class="mb-4 p-3 bg-green-50 border border-green-200 text-green-700 rounded">{{ success }}<div v-if="debugUrl" class="mt-2 text-xs text-gray-600">URL de prueba: <a :href="debugUrl" class="text-blue-600">{{ debugUrl }}</a></div></div>

            <form @submit.prevent="submit" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Correo electrónico</label>
                    <input v-model="email" type="email" required class="mt-1 block w-full rounded border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500" placeholder="tu@correo.com" />
                </div>

                <div class="flex items-center justify-between">
                    <button :disabled="loading" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 disabled:opacity-50">Enviar instrucciones</button>
                    <a href="./login.html" class="text-sm text-gray-600 hover:underline">Volver al login</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() { return { email: '', loading: false, error: '', success: '', debugUrl: '' }},
            methods: {
                async submit() {
                    this.error = '';
                    this.success = '';
                    this.debugUrl = '';
                    if (!this.email) return this.error = 'El correo es requerido.';
                    this.loading = true;
                    try {
                        const res = await fetch('./backend/api/forgot_password.php', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email: this.email.trim() })
                        });
                        const data = await res.json();
                        if (data.success) {
                            this.success = data.message || 'Si la cuenta existe, recibirás un correo con instrucciones.';
                            if (data.reset_url) this.debugUrl = data.reset_url;
                        } else {
                            this.error = data.message || 'Ocurrió un error.';
                        }
                    } catch (e) {
                        this.error = 'Error de conexión.';
                    } finally { this.loading = false; }
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
